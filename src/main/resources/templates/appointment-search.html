{{>header}}

<section class="narrow">
  <h1>Find an appointment</h1>
  <p class="muted">Search by appointment number. Capitalisation does not matter.</p>

  {{#if notFound}}
    <p class="alert error" role="alert">
      No appointment found for <strong>{{query}}</strong>. Check the number on the patient card.
    </p>
  {{/if}}

  <form method="get" action="/appointments/search" class="card form">
    <label for="q">Appointment number</label>
    <input id="q" name="q" value="{{query}}" placeholder="APT-2026-0001" required autofocus>
    <button class="button" type="submit">Search</button>
  </form>

  <p class="muted small"><a href="/appointments">Back to appointments</a></p>
</section>

{{>footer}}
