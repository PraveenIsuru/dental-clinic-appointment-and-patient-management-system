{{>header}}

<section>
  <div class="page-head">
    <div>
      <h1>Appointments</h1>
      {{#unless showsWholeHistory}}<p class="muted">{{count}} on {{date}}</p>{{/unless}}
      {{#if showsWholeHistory}}<p class="muted">Your appointments — {{count}} in total</p>{{/if}}
    </div>
    <div class="actions">
      {{#if canBook}}<a class="button" href="/appointments/new">New appointment</a>{{/if}}
      <a class="button ghost" href="/appointments/search">Search</a>
      <a class="button ghost" href="/availability">Availability</a>
    </div>
  </div>

  {{#unless showsWholeHistory}}
    <form class="inline-form" method="get" action="/appointments">
      <label for="date">Show day</label>
      <input id="date" name="date" type="date" value="{{dateIso}}">
      <button class="button ghost" type="submit">Go</button>
    </form>
  {{/unless}}

  {{{rows}}}
</section>

{{>footer}}
